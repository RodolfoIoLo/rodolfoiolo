version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: '09:20'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
